name: Manually approved unreleased candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: unreleased-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Build, verify, and attest reviewed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: unreleased-candidate
    steps:
      - name: Check out exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'Validated exact source commit: %s\n' "$actual"
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run checks and dependency audit
        run: |
          npm audit --audit-level=moderate
          npm run check
          npm run test:coverage
      - name: Build and verify deterministic artifacts
        run: |
          npm run build:release-candidate
          npm run verify:release-candidate
      - name: Require every recorded publication gate for the rebuilt bytes
        run: npm run check:publication-gates
      - name: Attest exact ZIP artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/current/*.zip
      - name: Upload candidate evidence without publishing a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manually-approved-unreleased-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: dist/current/
