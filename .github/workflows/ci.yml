name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static, safety, tests, coverage, and package parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'Validated exact source commit: %s\n' "$actual"
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked development tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Run complete local checks
        run: npm run check
      - name: Produce coverage evidence
        run: npm run test:coverage
      - name: Build normalized unreleased candidate artifacts
        run: npm run build:release-candidate
      - name: Verify checksums and source/package parity
        run: npm run verify:release-candidate
      - name: Upload synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitewipe-ci-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage/
            dist/current/
